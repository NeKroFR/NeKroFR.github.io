<script>// redpill VM: a stack machine (VM-A) and a register machine (VM-B) sharing M[0..3].
// TRAP n in VM-A runs VM-B microcode[n], then resumes. Round keys are immediates.
(function (root) {
  const U = x => x >>> 0;
  const ROL = (x, n) => U((x << n) | (x >>> (32 - n)));
  const rd32 = (p, i) => U(p[i] | (p[i + 1] << 8) | (p[i + 2] << 16) | (p[i + 3] << 24));

  // VM-B: register machine. prog = byte array. Shares M. R[0..3].
  function runB(prog, M) {
    const R = [0, 0, 0, 0];
    let pc = 0;
    for (;;) {
      const op = prog[pc++];
      if (op === 0x5f) return;                               // RET
      else if (op === 0x50) { const d = prog[pc++], i = prog[pc++]; R[d] = M[i]; }        // LDM Rd,[i]
      else if (op === 0x51) { const i = prog[pc++], s = prog[pc++]; M[i] = R[s]; }        // STM [i],Rs
      else if (op === 0x52) { const d = prog[pc++], imm = rd32(prog, pc); pc += 4; R[d] = U(R[d] ^ imm); } // XORI
      else if (op === 0x53) { const d = prog[pc++], imm = rd32(prog, pc); pc += 4; R[d] = U(R[d] + imm); } // ADDI
      else if (op === 0x54) { const d = prog[pc++], a = prog[pc++]; R[d] = ROL(R[d], a); }                 // ROLI
      else if (op === 0x55) { const d = prog[pc++], s = prog[pc++]; R[d] = U(R[d] + R[s]); }               // ADDR
      else throw new Error('B:bad op ' + op.toString(16) + ' @' + (pc - 1));
    }
  }

  // VM-A: stack machine. Starts here. HALT returns M.
  function run(image, input4) {
    const prog = image.code, micro = image.micro;
    const M = input4.slice(0, 4).map(U);
    const S = [];
    let pc = 0, guard = 0;
    for (;;) {
      if (++guard > 1e6) throw new Error('A:runaway');
      const op = prog[pc++];
      if (op === 0x00) return M;                              // HALT
      else if (op === 0x10) { S.push(rd32(prog, pc)); pc += 4; }   // PUSHI
      else if (op === 0x11) { S.push(M[prog[pc++]]); }             // PUSHM
      else if (op === 0x12) { M[prog[pc++]] = S.pop(); }           // POPM
      else if (op === 0x20) { const b = S.pop(), a = S.pop(); S.push(U(a + b)); }   // ADD
      else if (op === 0x21) { const b = S.pop(), a = S.pop(); S.push(U(a - b)); }   // SUB
      else if (op === 0x22) { const b = S.pop(), a = S.pop(); S.push(U(a ^ b)); }   // XOR
      else if (op === 0x23) { const b = S.pop(), a = S.pop(); S.push(U(Math.imul(a, b))); } // MUL
      else if (op === 0x24) { S.push(ROL(S.pop(), prog[pc++])); }  // ROL
      else if (op === 0x25) { const a = S.pop(); S.push(a); S.push(a); }            // DUP
      else if (op === 0x26) { const b = S.pop(), a = S.pop(); S.push(b); S.push(a); } // SWAP
      else if (op === 0x30) { runB(micro[prog[pc++]], M); }        // TRAP n -> nanomite
      else throw new Error('A:bad op ' + op.toString(16) + ' @' + (pc - 1));
    }
  }

  const api = { run };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.ZIONVM = api;
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>

// crypto chain
const te = new TextEncoder(), td = new TextDecoder();
const hexBytes = h => Uint8Array.from(h.match(/.{2}/g).map(b => parseInt(b, 16)));
const toHex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
async function deriveKey(answer, stage, prev) {
  const base = await crypto.subtle.importKey('raw', te.encode(answer), { name: 'PBKDF2' }, false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits(
    { name: 'PBKDF2', hash: 'SHA-256', salt: te.encode('zion/' + stage + '/' + (prev || '')), iterations: ITER }, base, 256);
  return toHex(bits);
}
async function openBlob(b64, keyHex) {
  const raw = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const key = await crypto.subtle.importKey('raw', hexBytes(keyHex), { name: 'AES-GCM' }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: raw.slice(0, 12) }, key, raw.slice(12));
  return JSON.parse(td.decode(pt));
}
async function sha256hex(s) { return toHex(await crypto.subtle.digest('SHA-256', te.encode(s))); }

// state
const LS = 'zion.v1';
const State = {
  stage: 0,            // highest unlocked stage (0..4)
  keys: {},            // stage -> keyHex used to open its blob
  data: {},            // stage -> decrypted content
  files: {},           // merged visible files
};
function save() { localStorage.setItem(LS, JSON.stringify({ stage: State.stage, keys: State.keys })); }
function load() { try { return JSON.parse(localStorage.getItem(LS)) || null; } catch { return null; } }

// terminal
const out = document.getElementById('out'), inp = document.getElementById('in'), ps = document.getElementById('ps');
let pending = null;   // function(line) for interactive prompts
const hist = []; let hi = 0;
function line(t = '', cls = '', html = false) {
  const d = document.createElement('div');
  if (cls) d.className = cls;
  if (html) d.innerHTML = t; else d.textContent = t;
  out.appendChild(d); out.scrollTop = out.scrollHeight;
  return d;
}
async function typeLines(arr, cls = '', speed = 18) {
  for (const t of arr) {
    const d = line('', cls);
    for (const ch of t) { d.textContent += ch; out.scrollTop = out.scrollHeight; await sleep(speed); }
    await sleep(120);
  }
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

inp.addEventListener('keydown', async e => {
  if (e.key === 'Enter') {
    const v = inp.value; inp.value = '';
    if (pending) { const f = pending; pending = null; await f(v); return; }
    const t = v.trim();
    line(ps.textContent + ' ' + v, 'dim');
    if (t) { hist.push(t); hi = hist.length; await run(t); }
  } else if (e.key === 'ArrowUp') { e.preventDefault(); if (hi > 0) inp.value = hist[--hi]; }
  else if (e.key === 'ArrowDown') { e.preventDefault(); if (hi < hist.length - 1) inp.value = hist[++hi]; else { hi = hist.length; inp.value = ''; } }
});
document.addEventListener('click', () => { if (document.getElementById('grid').style.display !== 'block') inp.focus(); });

// unlock
async function unlock(stage, answer) {
  const prev = stage === 1 ? '' : State.keys[stage - 1];
  const key = await deriveKey(answer, stage, prev);
  let data;
  try { data = await openBlob(BLOBS[stage], key); }
  catch { return false; }
  State.keys[stage] = key; State.data[stage] = data;
  State.stage = Math.max(State.stage, stage);
  Object.assign(State.files, data.files || {});
  save();
  return data;
}
async function reopenAll(st) {
  const target = st.stage;           // capture: the loop below mutates State.stage (st === State)
  State.stage = 0;
  for (let s = 1; s <= target; s++) {
    const key = st.keys[s]; if (!key) break;
    try {
      const data = await openBlob(BLOBS[s], key);
      State.keys[s] = key; State.data[s] = data; State.stage = s;
      Object.assign(State.files, data.files || {});
    } catch { break; }
  }
}

// commands
function help() {
  const base = ['help  ls  cat <file>  clear  whoami  status'];
  const perStage = {
    0: ['login                      authenticate as operator'],
    1: ['redpill <32 hex>           run the crackme on 16 bytes'],
    2: ['submit <private key hex>   hand the Oracle her key back'],
    3: ['download trinity.json  |  grid  |  try <16 hex>'],
    4: ['proof <handle>  |  ./morpheus'],
  };
  line('commands:', 'sys');
  base.forEach(l => line('  ' + l, 'dim'));
  for (let s = 0; s <= State.stage; s++) (perStage[s] || []).forEach(l => line('  ' + l, 'dim'));
}
function ls() {
  const names = Object.keys(State.files);
  if (!names.length) { line('(nothing here yet. the door is still closed)', 'dim'); return; }
  names.forEach(n => line(n, 'sys'));
}
function cat(f) {
  if (!f) return line('cat: missing file', 'err');
  if (!Object.hasOwn(State.files, f)) return line('cat: ' + f + ': no such file', 'err');
  line(State.files[f]);
}

async function doLogin() {
  if (State.stage >= 1) return line('already authenticated. you are in.', 'sys');
  line('login: ', 'sys');
  pending = async user => {
    line('Password: ', 'sys');
    pending = async pass => {
      // gets(s.user) overflows the 16-byte buffer into the 8-byte role field
      const role = user.length > 16 ? user.slice(16, 24) : 'guest';
      line('', ''); line('session = { user:"' + user.slice(0, 16) + '", role:"' + role + '" }', 'dim');
      const data = await unlock(1, pass + '/' + role);
      if (!data) { line('access denied: role=' + role + '. Agent Smith is watching.', 'err'); return; }
      line('access granted. welcome, operator.', 'flag');
      line('flag: ' + data.flag, 'flag');
      await enterStage(data);
    };
  };
}

async function redpill(arg) {
  const data = State.data[1]; if (!data) return line('redpill: not here yet', 'err');
  if (!/^[0-9a-fA-F]{32}$/.test(arg || '')) return line('usage: redpill <32 hex digits>', 'err');
  const bytes = hexBytes(arg.toLowerCase());
  const words = [0, 1, 2, 3].map(i => (bytes[4 * i] | (bytes[4 * i + 1] << 8) | (bytes[4 * i + 2] << 16) | (bytes[4 * i + 3] << 24)) >>> 0);
  let res;
  try { res = ZIONVM.run(data.image, words); } catch (e) { return line('trap: ' + e.message, 'err'); }
  const ok = res.length === 4 && res.every((w, i) => (w >>> 0) === (data.target[i] >>> 0));
  if (!ok) { line('Mr. Anderson... that is not the One. [' + res.map(w => (w >>> 0).toString(16).padStart(8, '0')).join(' ') + ']', 'err'); return; }
  const up = await unlock(2, arg.toLowerCase());
  if (!up) return line('vm matched but the lock refused. report this.', 'err');
  line('the program halts. M == TARGET. you think in two machines now.', 'flag');
  line('flag: ' + up.flag, 'flag');
  await enterStage(up);
}

async function submit(arg) {
  const data = State.data[2]; if (!data) return line('submit: not here yet', 'err');
  let d = (arg || '').trim().toLowerCase().replace(/^0x/, '');
  if (!/^[0-9a-f]{1,64}$/.test(d)) return line('usage: submit <private key hex>', 'err');
  d = d.padStart(64, '0');
  const up = await unlock(3, d);
  if (!up) { line('the Oracle shakes her head. "That is not what I told them."', 'err'); return; }
  line('"I knew you\'d work it out. You always do." The key was hers all along.', 'flag');
  line('flag: ' + up.flag, 'flag');
  await enterStage(up);
}

async function tryKey(arg) {
  const data = State.data[3]; if (!data) return line('try: not here yet', 'err');
  const x = (arg || '').trim().toLowerCase();
  if (!/^[0-9a-f]{16}$/.test(x)) return line('usage: try <16 hex digits>', 'err');
  if (gridSim) runBytesOnGrid(x);
  const up = await unlock(4, x);
  if (!up) { line('the grid stays lit. flag=0.', 'err'); return; }
  line('flag=1. the grid goes dark.', 'flag');
  line('flag: ' + up.flag, 'flag');
  closeGrid();
  await enterStage(up);
}

async function proof(handle) {
  if (State.stage < 4) return line('proof: finish first.', 'err');
  if (!handle) return line('usage: proof <handle>', 'err');
  const p = (await sha256hex(State.keys[4] + ':' + handle)).slice(0, 16);
  line('PROOF ' + handle + ' ' + p, 'flag');
  line('send that line to NeKroFR for the hall of fame.', 'sys');
}

// stage entry
async function enterStage(data) {
  await sleep(200);
  if (data.motd) { line(''); await typeLines(data.motd, 'sys'); }
  if (State.stage === 4) {
    line('');
    await typeLines(data.reveal, 'big', 24);
    line('');
    data.after.forEach(l => line(l, 'dim'));
  }
}

async function run(t) {
  const [cmd, ...rest] = t.split(/\s+/);
  const arg = rest.join(' ');
  switch (cmd.toLowerCase()) {
    case 'help': case '?': return help();
    case 'ls': case 'dir': return ls();
    case 'cat': case 'less': case 'more': return cat(arg);
    case 'clear': case 'cls': out.innerHTML = ''; return;
    case 'whoami': return line(State.stage >= 4 ? (State.data[4]?.whoami || 'the One') : (State.stage >= 1 ? 'operator' : 'guest'), 'sys');
    case 'status': return status();
    case 'login': return doLogin();
    case 'redpill': return redpill(arg);
    case 'bluepill': case 'blue': return line('you wake up in your bed and believe whatever you want to believe.', 'sys');
    case 'submit': return submit(arg);
    case 'download': return download(arg);
    case 'grid': return openGrid();
    case 'try': return tryKey(arg);
    case 'proof': return proof(arg);
    case 'sudo': return line('there is no spoon.', 'warn');
    case 'morpheus': case './morpheus':
      return line(State.stage >= 4 ? 'He is still dreaming. Come back when he wakes.' : 'morpheus: permission denied', 'warn');
    case 'operator': return line('github.com/NeKroFR', 'sys');
    case 'exit': case 'quit': return line('there is no exit. not yet.', 'warn');
    case 'reset': if (arg === '--hard') { localStorage.removeItem(LS); line('state wiped. reload.', 'warn'); } else line('reset --hard to wipe progress', 'dim'); return;
    default: return line(cmd + ': command not found', 'err');
  }
}
function status() {
  const names = ['white rabbit', 'redpill', 'oracle', 'trinity', 'awake'];
  const bar = [0, 1, 2, 3, 4].map(i => State.stage > i ? '■' : (State.stage === i ? '▶' : '□')).join('');
  line('[' + bar + ']  stage ' + State.stage + '/4  ' + names[Math.min(State.stage, 4)], 'sys');
}
function download(f) {
  if (f !== 'trinity.json') return line('download: only trinity.json', 'err');
  if (!State.files['trinity.json']) return line('download: not unlocked', 'err');
  const b = new Blob([State.files['trinity.json']], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'trinity.json'; a.click();
  line('trinity.json saved.', 'sys');
}

// netlist (stage 3 grid)
let gridSim = null, gridRenderer = null, gridRAF = 0;
const PIN_DEFS = {
  '$_DFF_P_':      { in: { D: [0, .5], C: [.3, 1] }, out: { Q: [1, .5] }, label: 'DFF' },
  '$_SDFFE_PP0P_': { in: { D: [0, .25], E: [0, .75], C: [.25, 1], R: [.75, 1] }, out: { Q: [1, .5] }, label: 'SDFFE' },
  '$_NOT_': { in: { A: [0, .5] }, out: { Y: [1, .5] }, label: 'NOT' },
  '$_OR_':  { in: { A: [0, .3], B: [0, .7] }, out: { Y: [1, .5] }, label: 'OR' },
  '$_AND_': { in: { A: [0, .3], B: [0, .7] }, out: { Y: [1, .5] }, label: 'AND' },
  '$_XOR_': { in: { A: [0, .3], B: [0, .7] }, out: { Y: [1, .5] }, label: 'XOR' },
  '$_MUX_': { in: { A: [0, .28], B: [0, .72], S: [.5, 1] }, out: { Y: [1, .5] }, label: 'MUX' },
};
const CW = 86, CH = 50;
const isSeq = t => t.includes('DFF');

function layout(nl) {
  const cells = nl.cells, ports = nl.ports, driver = {};
  for (const [pn, p] of Object.entries(ports)) if (p.direction === 'input') for (const b of p.bits) driver[b] = 'port:' + pn;
  for (const [cn, c] of Object.entries(cells)) { const d = PIN_DEFS[c.type]; if (!d) continue; for (const [pin, nets] of Object.entries(c.connections)) if (d.out[pin]) driver[nets[0]] = cn; }
  const clk = ports.clk && ports.clk.bits[0], rst = ports.rst && ports.rst.bits[0];
  const depth = {}; for (const cn in cells) depth[cn] = 0;
  for (let it = 0; it < 40; it++) { let ch = false;
    for (const [cn, c] of Object.entries(cells)) { const d = PIN_DEFS[c.type]; if (!d) continue; let mx = 0;
      for (const [pin, nets] of Object.entries(c.connections)) { if (d.out[pin]) continue; const nid = nets[0];
        if (typeof nid === 'string' || nid === clk || nid === rst) continue;
        const drv = driver[nid]; if (!drv || drv.startsWith('port:')) continue;
        if (isSeq(cells[drv].type) && !isSeq(c.type)) mx = Math.max(mx, 1);
        else if (!isSeq(cells[drv].type)) mx = Math.max(mx, depth[drv] + 1);
        else mx = Math.max(mx, 1);
      }
      if (mx !== depth[cn]) { depth[cn] = mx; ch = true; }
    }
    if (!ch) break;
  }
  // order by logic depth (keeps left->right dataflow), then pack into a square-ish die
  const order = Object.keys(cells).sort((a, b) => (depth[a] - depth[b]) || (a < b ? -1 : 1));
  const N = order.length;
  const SX = 150, SY = 30, CXs = 132, RYs = 60;
  const ncols = Math.max(1, Math.round(Math.sqrt(1.6 * N * RYs / CXs)));
  const perCol = Math.ceil(N / ncols);
  const pos = {};
  order.forEach((cn, i) => { const c = Math.floor(i / perCol), r = i % perCol; pos[cn] = { x: SX + c * CXs, y: SY + r * RYs }; });
  const ip = {}; let iy = SY + 10;
  for (const [pn, p] of Object.entries(ports)) { if (p.direction !== 'input') continue;
    p.bits.forEach((b, i) => { ip[p.bits.length > 1 ? pn + '[' + i + ']' : pn] = { x: 40, y: iy, net: b }; iy += 26; }); }
  const op = {}; const mx = SX + (ncols + 1) * CXs; let oy = SY + 10;
  for (const [pn, p] of Object.entries(ports)) { if (p.direction !== 'output') continue;
    p.bits.forEach((b, i) => { op[p.bits.length > 1 ? pn + '[' + i + ']' : pn] = { x: mx, y: oy, net: b }; oy += 26; }); }
  return { pos, ip, op, driver, mx };
}
function pinPos(nl, L, cn, pin) { const c = nl.cells[cn], p = L.pos[cn]; if (!p) return { x: 0, y: 0 }; const d = PIN_DEFS[c.type]; const q = (d.in[pin] || d.out[pin]); return q ? { x: p.x + q[0] * CW, y: p.y + q[1] * CH } : { x: p.x, y: p.y }; }
function routeWire(s, t) { const p = [{ ...s }]; const dx = t.x - s.x; if (Math.abs(t.y - s.y) < 3 && dx >= 0) p.push({ ...t }); else if (dx >= 20) { const m = s.x + dx * .5; p.push({ x: m, y: s.y }, { x: m, y: t.y }, { ...t }); } else { const dt = Math.max(s.y, t.y) + 28; p.push({ x: s.x + 14, y: s.y }, { x: s.x + 14, y: dt }, { x: t.x - 14, y: dt }, { x: t.x - 14, y: t.y }, { ...t }); } return p; }
function wires(nl, L) {
  const w = [];
  for (const [cn, c] of Object.entries(nl.cells)) { const d = PIN_DEFS[c.type]; if (!d) continue;
    for (const [pin, nets] of Object.entries(c.connections)) { if (d.out[pin]) continue; const nid = nets[0]; if (typeof nid === 'string') continue;
      const dst = pinPos(nl, L, cn, pin); const drv = L.driver[nid]; let src = null;
      if (!drv) continue;
      if (drv.startsWith('port:')) { for (const pp of Object.values(L.ip)) if (pp.net === nid) { src = { x: pp.x + 14, y: pp.y }; break; } }
      else { const dc = nl.cells[drv], dd = PIN_DEFS[dc.type]; for (const [dp, dn] of Object.entries(dc.connections)) if (dd.out[dp] && dn[0] === nid) { src = pinPos(nl, L, drv, dp); break; } }
      if (src) w.push({ net: nid, path: routeWire(src, dst) });
    } }
  for (const pp of Object.values(L.op)) { const nid = pp.net; const drv = L.driver[nid]; if (!drv || drv.startsWith('port:')) continue; const dc = nl.cells[drv], dd = PIN_DEFS[dc.type]; let src = null; for (const [dp, dn] of Object.entries(dc.connections)) if (dd.out[dp] && dn[0] === nid) { src = pinPos(nl, L, drv, dp); break; } if (src) w.push({ net: nid, path: routeWire(src, { x: pp.x, y: pp.y }) }); }
  return w;
}
class Sim {
  constructor(nl) { this.nl = nl; this.nets = { '0': 0, '1': 1 }; this.prev = {};
    for (const p of Object.values(nl.ports)) for (const b of p.bits) this.nets[b] = 0;
    for (const c of Object.values(nl.cells)) for (const a of Object.values(c.connections)) for (const b of a) this.nets[b] = this.nets[b] || 0;
    this.clk = nl.ports.clk && nl.ports.clk.bits[0];
    // topological order of combinational cells (flops are evaluation barriers)
    const driver = {};
    for (const [nm, c] of Object.entries(nl.cells)) { if (isSeq(c.type)) continue; const Y = PIN_DEFS[c.type].out; for (const p in Y) driver[c.connections[p][0]] = nm; }
    const comb = Object.entries(nl.cells).filter(([, c]) => !isSeq(c.type));
    const indeg = {}, adj = {};
    for (const [nm, c] of comb) { indeg[nm] = 0; adj[nm] = []; }
    for (const [nm, c] of comb) { const d = PIN_DEFS[c.type]; for (const pin in d.in) { const nid = c.connections[pin][0]; const src = driver[nid]; if (src !== undefined && src !== nm) { adj[src].push(nm); indeg[nm]++; } } }
    const q = comb.filter(([nm]) => indeg[nm] === 0).map(([nm]) => nm); const order = [];
    while (q.length) { const nm = q.shift(); order.push(nm); for (const nx of adj[nm]) if (--indeg[nx] === 0) q.push(nx); }
    for (const [nm] of comb) if (!order.includes(nm)) order.push(nm); // any residual (cycles shouldn't exist)
    this.order = order;
  }
  g(id) { return id === '0' ? 0 : id === '1' ? 1 : (this.nets[id] | 0); }
  setPort(n, v) { const b = this.nl.ports[n]; if (!b) return; b.bits.forEach((bit, i) => this.nets[bit] = (v >> i) & 1); }
  getPort(n) { const b = this.nl.ports[n]; if (!b) return 0; let v = 0; b.bits.forEach((bit, i) => v |= this.g(bit) << i); return v >>> 0; }
  snap() { this.prev = { ...this.nets }; }
  changed(id) { return this.nets[id] !== this.prev[id]; }
  evalComb() { for (const nm of this.order) { const c = this.nl.cells[nm], n = c.connections, t = c.type;
    if (t === '$_NOT_') this.nets[n.Y[0]] = this.g(n.A[0]) ? 0 : 1;
    else if (t === '$_OR_') this.nets[n.Y[0]] = this.g(n.A[0]) | this.g(n.B[0]);
    else if (t === '$_AND_') this.nets[n.Y[0]] = this.g(n.A[0]) & this.g(n.B[0]);
    else if (t === '$_XOR_') this.nets[n.Y[0]] = this.g(n.A[0]) ^ this.g(n.B[0]);
    else if (t === '$_MUX_') this.nets[n.Y[0]] = this.g(n.S[0]) ? this.g(n.B[0]) : this.g(n.A[0]);
  } }
  clockRise() { this.snap(); if (this.clk != null) this.nets[this.clk] = 1;
    // two-phase: read all D/E/R against current state, THEN commit (shift regs chain Q->D)
    const cap = [];
    for (const [nm, c] of Object.entries(this.nl.cells)) { const n = c.connections;
      if (c.type === '$_DFF_P_') cap.push([n.Q[0], this.g(n.D[0])]);
      else if (c.type === '$_SDFFE_PP0P_') { const r = this.g(n.R[0]), e = this.g(n.E[0]), d = this.g(n.D[0]); cap.push([n.Q[0], r ? 0 : (e ? d : this.g(n.Q[0]))]); }
    }
    for (const [q, v] of cap) this.nets[q] = v;
    this.evalComb();
  }
  clockFall() { if (this.clk != null) this.nets[this.clk] = 0; }
}
class Renderer {
  constructor(cv, sim, nl, L, W) { this.cv = cv; this.ctx = cv.getContext('2d'); this.sim = sim; this.nl = nl; this.L = L; this.W = W;
    this.powered = false; this.flash = {}; this.zoom = 1; this.panX = 0; this.panY = 0; this.drag = false;
    let maxX = 0, maxY = 0; for (const p of Object.values(L.pos)) { maxX = Math.max(maxX, p.x + CW); maxY = Math.max(maxY, p.y + CH); }
    this.dw = maxX + 180; this.dh = maxY + 60;
    this._onWheel = e => { e.preventDefault(); const z0 = this.zoom; this.zoom = Math.max(.15, Math.min(6, this.zoom * (e.deltaY > 0 ? .9 : 1.1)));
      const r = cv.getBoundingClientRect(), mx = (e.clientX - r.left) * this.dpr, my = (e.clientY - r.top) * this.dpr;
      this.panX = mx - (mx - this.panX) * this.zoom / z0; this.panY = my - (my - this.panY) * this.zoom / z0; };
    this._onDown = e => { this.drag = true; this.sx = e.clientX; this.sy = e.clientY; cv.style.cursor = 'grabbing'; };
    this._onMove = e => { if (!this.drag) return; this.panX += (e.clientX - this.sx) * this.dpr; this.panY += (e.clientY - this.sy) * this.dpr; this.sx = e.clientX; this.sy = e.clientY; };
    this._onUp = () => { this.drag = false; cv.style.cursor = 'grab'; };
    cv.addEventListener('wheel', this._onWheel, { passive: false });
    cv.addEventListener('mousedown', this._onDown);
    addEventListener('mousemove', this._onMove);
    addEventListener('mouseup', this._onUp);
    this.resize();
  }
  destroy() { this.cv.removeEventListener('wheel', this._onWheel); this.cv.removeEventListener('mousedown', this._onDown);
    removeEventListener('mousemove', this._onMove); removeEventListener('mouseup', this._onUp); }
  resize() { this.dpr = devicePixelRatio || 1; this.cv.width = innerWidth * this.dpr; this.cv.height = innerHeight * this.dpr;
    this.cv.style.width = innerWidth + 'px'; this.cv.style.height = innerHeight + 'px';
    this.base = Math.min(innerWidth * .95 / this.dw, innerHeight * .85 / this.dh, 1.4) * this.dpr;
    this.panX = (this.cv.width - this.dw * this.base) / 2; this.panY = (this.cv.height - this.dh * this.base) / 2; }
  onClockTick() { for (const id of Object.keys(this.sim.nets)) if (this.sim.changed(id)) this.flash[id] = .45; }
  wstyle(n) { if (!this.powered) return { c: '#0c160c', w: .6 }; const v = this.sim.g(n), f = this.flash[n] || 0;
    if (f > 0) return { c: v ? 'rgba(0,255,65,' + (.6 + .4 * f / .45) + ')' : 'rgba(80,120,80,.5)', w: v ? 2.4 : 1.4, glow: v ? 9 : 0 };
    return { c: v ? '#00ee3a' : '#0e1a0e', w: v ? 1.8 : .7, glow: 0 }; }
  draw(dt) { for (const k in this.flash) { this.flash[k] -= dt; if (this.flash[k] <= 0) delete this.flash[k]; }
    const ctx = this.ctx; ctx.fillStyle = '#06080c'; ctx.fillRect(0, 0, this.cv.width, this.cv.height);
    ctx.save(); ctx.translate(this.panX, this.panY); ctx.scale(this.base * this.zoom, this.base * this.zoom);

      ctx.strokeStyle = s.c; ctx.lineWidth = s.w; if (s.glow) { ctx.shadowColor = '#00ff41'; ctx.shadowBlur = s.glow; } ctx.stroke(); ctx.shadowBlur = 0; }
    for (const [cn, c] of Object.entries(this.nl.cells)) { const p = this.L.pos[cn]; if (!p) continue; const d = PIN_DEFS[c.type]; if (!d) continue; const dim = !this.powered;
      ctx.fillStyle = dim ? '#0a0d14' : '#0e1424'; ctx.strokeStyle = dim ? '#151e30' : '#2a4a6e'; ctx.lineWidth = 1.1;
      rr(ctx, p.x, p.y, CW, CH, 3); ctx.fill(); ctx.stroke();
      ctx.fillStyle = dim ? '#1a2a40' : '#4a7aae'; ctx.font = '10px Share Tech Mono'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText(d.label, p.x + CW / 2, p.y + 3);
      for (const [pin, q] of Object.entries({ ...d.in, ...d.out })) { const px = p.x + q[0] * CW, py = p.y + q[1] * CH; const nid = c.connections[pin] && c.connections[pin][0]; const v = this.powered && this.sim.g(nid);

    for (const [lb, pp] of Object.entries(this.L.ip)) { const v = this.powered && this.sim.g(pp.net);
      ctx.fillStyle = v ? '#00ff41' : '#1a3a1a'; ctx.beginPath(); ctx.moveTo(pp.x + 14, pp.y); ctx.lineTo(pp.x + 8, pp.y - 4); ctx.lineTo(pp.x + 8, pp.y + 4); ctx.fill();
      ctx.fillStyle = v ? '#00dd36' : '#2a5a3a'; ctx.font = '8px Share Tech Mono'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.fillText(lb, pp.x + 4, pp.y); }
    for (const [lb, pp] of Object.entries(this.L.op)) { const v = this.powered && this.sim.g(pp.net);
      ctx.fillStyle = v ? '#00ff41' : '#1a3a1a'; ctx.beginPath(); ctx.moveTo(pp.x, pp.y); ctx.lineTo(pp.x - 6, pp.y - 4); ctx.lineTo(pp.x - 6, pp.y + 4); ctx.fill();
      ctx.fillStyle = v ? '#ffd040' : '#2a5a3a'; ctx.font = '10px Share Tech Mono'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(lb, pp.x + 8, pp.y); }

}
function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

function openGrid() {
  const data = State.data[3]; if (!data) return line('grid: not unlocked', 'err');
  if (gridRenderer) return line('grid already open (ESC to close).', 'dim');
  const nl = data.netlist.modules.trinity;
  const cv = document.getElementById('grid'), hud = document.getElementById('ghud');
  const L = layout(nl), W = wires(nl, L);
  gridSim = new Sim(nl); gridSim.evalComb();
  gridRenderer = new Renderer(cv, gridSim, nl, L, W);
  cv.style.display = 'block'; hud.style.display = 'block'; cv.style.cursor = 'grab';
  updateHud();
  let last = performance.now();
  (function loop(ts) { if (!gridRenderer) return; const dt = Math.min((ts - last) / 1000, .05); last = ts; gridRenderer.draw(dt); gridRAF = requestAnimationFrame(loop); })(last);
  line('grid open. drag to pan, wheel to zoom, ESC to close. feed it with: try <16 hex>', 'sys');
  addEventListener('resize', gridResize);
}
function gridResize() { if (gridRenderer) gridRenderer.resize(); }
function closeGrid() { if (gridRAF) cancelAnimationFrame(gridRAF); gridRAF = 0;
  removeEventListener('resize', gridResize);
  if (gridRenderer) gridRenderer.destroy();
  gridRenderer = null; gridSim = null;
  document.getElementById('grid').style.display = 'none'; document.getElementById('ghud').style.display = 'none'; inp.focus(); }
function updateHud(fed) {
  const f = gridSim ? gridSim.getPort('flag') : 0;
  document.getElementById('ghud').innerHTML = 'TRINITY POWER GRID<br>fed: <b>' + (fed || '········') + '</b><br>flag = <b>' + f + '</b>' + (f ? '  GRID DOWN' : '');
}
function runBytesOnGrid(x) {
  const s = gridSim; gridRenderer.powered = true;
  s.setPort('rst', 1); s.setPort('valid', 0); s.setPort('din', 0); s.evalComb(); s.clockRise(); s.clockFall();
  s.setPort('rst', 0);
  for (const by of hexBytes(x)) { s.setPort('din', by); s.setPort('valid', 1); s.evalComb(); s.clockRise(); gridRenderer.onClockTick(); s.clockFall(); }
  s.evalComb(); updateHud(x);
}
addEventListener('keydown', e => { if (e.key === 'Escape' && gridRAF) closeGrid(); });

// matrix rain
(function () {
  const cv = document.getElementById('rain'), ctx = cv.getContext('2d');
  const chars = '01ABCDEF8049<>+^xorrolmuxdffΣλ0123456789abcdef'.split('');
  let cols, drops, fs = 14;
  function resize() { cv.width = innerWidth; cv.height = innerHeight; cols = Math.floor(cv.width / fs); drops = Array(cols).fill(0).map(() => Math.random() * -50); }
  resize(); addEventListener('resize', resize);
  (function draw() {
    ctx.fillStyle = 'rgba(0,0,0,.08)'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.font = fs + 'px Share Tech Mono, monospace';
    for (let i = 0; i < cols; i++) {
      const c = chars[(Math.random() * chars.length) | 0];
      const y = drops[i] * fs;
      ctx.fillStyle = y > 0 && Math.random() < .02 ? '#d0ffe0' : '#0a9a2a';
      ctx.fillText(c, i * fs, y);
      if (y > cv.height && Math.random() > .975) drops[i] = 0; else drops[i] += 1;
    }
    requestAnimationFrame(draw);
  })();
})();

// boot
async function boot() {
  const prev = load();
  if (prev && prev.stage > 0) {
    State.stage = prev.stage; State.keys = prev.keys || {};
    await reopenAll(State);
    line('// session restored, stage ' + State.stage + '/4', 'dim');
    status();
    line("type 'help'.", 'dim');
    return;
  }
  inp.parentElement.style.visibility = 'hidden';
  await typeLines(['Wake up, Neo...', 'The Matrix has you...', 'Follow the white rabbit.'], 'big', 55);
  await sleep(500);
  line('');
  line("Knock, knock, Neo.", 'sys');
  line('');
  line("There is nothing to see here. Or is there? (try 'help', and read the source)", 'dim');
  inp.parentElement.style.visibility = 'visible';
  inp.focus();
}
boot();
